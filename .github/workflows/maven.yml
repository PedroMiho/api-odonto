
name: Agendamento Odontologico CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Permitir execucao do Maven Wrapper
        run: chmod +x mvnw

      - name: Verificar variaveis de ambiente
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "ERRO: DB_URL nao configurada."
            exit 1
          fi

          if [[ "$DB_URL" != jdbc:mysql://* ]]; then
            echo "ERRO: DB_URL deve iniciar com jdbc:mysql://"
            exit 1
          fi

          if [ -z "$DB_USERNAME" ] || [ -z "$DB_PASSWORD" ] || [ -z "$JWT_SECRET" ]; then
            echo "ERRO: Verifique DB_USERNAME, DB_PASSWORD e JWT_SECRET."
            exit 1
          fi

          echo "Variaveis configuradas corretamente."

      - name: Executar testes e gerar o pacote
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: ./mvnw --batch-mode clean verify

      - name: Validar a imagem Docker
        run: docker build -t agendamento-odontologico:${{ github.sha }} .

  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Acionar o Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Configure o Secret RENDER_DEPLOY_HOOK_URL."
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"
